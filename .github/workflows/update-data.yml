name: Sync Xero matches

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *' # stündlich (nicht zur vollen Stunde, da ist GitHub überlastet)

concurrency:
  group: sync-xero
  cancel-in-progress: false

permissions:
  contents: write
  actions: write # für den Keepalive

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Neue Matches von der Xero API holen
        env:
          XERO_ACCESS_KEY_ID: ${{ secrets.XERO_ACCESS_KEY_ID }}
          XERO_SECRET_ACCESS_KEY: ${{ secrets.XERO_SECRET_ACCESS_KEY }}
        run: python scripts/sync_xero.py

      - name: Commit & Push (löst das Vercel-Deployment aus)
        run: |
          if git diff --quiet data/matches.json; then
            echo "Keine neuen Matches."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/matches.json
          git commit -m "data: neue Matches von Xero"
          git push

      # GitHub deaktiviert geplante Workflows nach 60 Tagen ohne Repo-Aktivität –
      # in Spielpausen würde der Sync sonst still stehen bleiben (wie Feb. 2026 passiert).
      - uses: gautamkrishnar/keepalive-workflow@v2
        with:
          use_api: true
